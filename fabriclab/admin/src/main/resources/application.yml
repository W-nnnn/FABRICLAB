server:
  port: 8081
  servlet:
    session:
      # 后台独立 Cookie 名，与用户端 STORESESSION 隔离（AC-06）。
      cookie:
        name: ADMINSESSION
        http-only: true
      timeout: 30m

spring:
  application:
    name: fabriclab-admin
  thymeleaf:
    cache: false
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:MyPetStore}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
