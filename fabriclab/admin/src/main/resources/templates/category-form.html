<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments :: head('admin.cat.title')}"></head>
<body>
<a class="skip" href="#main" th:text="#{admin.skip}">跳到主要内容</a>
<div class="shell">
    <div th:replace="~{fragments :: side('categories')}"></div>
    <div class="scrim" id="scrim"></div>
    <div class="wrap">
        <div th:replace="~{fragments :: topbar(#{admin.nav.products}, #{admin.cat.title})}"></div>
        <main class="main" id="main">
            <div class="page">
                <div class="ph">
                    <div>
                        <div class="ph__eyebrow"><em>02</em><span th:text="#{admin.nav.products}">商品</span></div>
                        <h1 th:text="${editing} ? #{admin.cat.editTitle} : #{admin.cat.newTitle}">新增分类</h1>
                        <p th:text="#{admin.cat.note}">两级分类。</p>
                    </div>
                </div>

                <div class="alert alert--err" th:if="${error != null}" role="alert">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="flex:none"><use href="#i-alert"/></svg>
                    <span th:text="${error}">错误</span>
                </div>

                <div class="cols">
                    <div>
                        <form id="catForm" method="post"
                              th:action="${editing} ? @{/admin/categories/{id}(id=${form.id})} : @{/admin/categories}">
                            <input type="hidden" name="_csrf" th:value="${csrfToken}" />
                            <section class="block">
                                <div class="block__head">
                                    <span class="block__no">01</span>
                                    <div><h2 th:text="#{admin.cat.title}">分类维护</h2>
                                        <p th:text="#{admin.cat.immutable}">创建后不可修改</p></div>
                                </div>
                                <div class="field">
                                    <label th:for="code"><span th:text="#{admin.cat.code}">编码</span><em>*</em></label>
                                    <input class="ctl" id="code" name="code" maxlength="32" th:value="${form.code}"
                                           th:readonly="${editing}" th:classappend="${editing} ? 'ctl--ro'" />
                                    <div class="help"><span th:text="#{admin.cat.codeHint}">全局唯一</span></div>
                                </div>
                                <div class="field">
                                    <label th:for="parentId"><span th:text="#{admin.cat.parent}">上级分类</span></label>
                                    <select class="ctl" id="parentId" name="parentId" th:disabled="${editing}">
                                        <option value="" th:text="#{admin.cat.parentNone}">一级分类（无上级）</option>
                                        <option th:each="p : ${parents}" th:value="${p.id}" th:text="${tr.t(p.name)}"
                                                th:selected="${form.parentId != null and form.parentId == p.id}">—</option>
                                    </select>
                                    <input th:if="${editing}" type="hidden" name="parentId" th:value="${form.parentId}" />
                                    <div class="help"><span th:text="#{admin.cat.immutable}">创建后不可修改</span></div>
                                </div>
                                <div class="field">
                                    <label th:for="name"><span th:text="#{admin.cat.name}">名称</span><em>*</em></label>
                                    <input class="ctl" id="name" name="name" maxlength="50" th:value="${form.name}" />
                                    <div class="help"><span th:text="#{admin.cat.sortHint}">数值越小越靠前</span></div>
                                </div>
                                <div class="field">
                                    <label th:for="sortOrder"><span th:text="#{admin.cat.sort}">排序</span></label>
                                    <input class="ctl" id="sortOrder" name="sortOrder" type="number" min="0" th:value="${form.sortOrder}" />
                                </div>
                            </section>
                        </form>
                    </div>
                    <aside class="aside-col">
                        <div class="aside-sec">
                            <h3 th:text="#{admin.console.note}">说明</h3>
                            <p style="font-size:11.5px;color:var(--muted);line-height:1.8" th:text="#{admin.cat.note}">两级分类说明</p>
                        </div>
                        <div class="aside-sec">
                            <h3 th:text="#{admin.console.runtime}">运行状态</h3>
                            <dl class="facts">
                                <dt th:text="#{admin.cat.colLevel}">层级</dt><dd th:text="${form.parentId != null} ? #{admin.cat.level2} : #{admin.cat.level1}">一级</dd>
                                <dt th:text="#{admin.cat.colProducts}">款数</dt><dd>0</dd>
                            </dl>
                        </div>
                    </aside>
                </div>
                <footer th:replace="~{fragments :: footer}"></footer>
            </div>
        </main>
        <div class="actions-bar">
            <span class="actions-bar__note" th:text="#{admin.prod.saveHint}">修改仅在点击保存后生效</span>
            <div class="actions-bar__act">
                <a class="btn btn--line" th:href="@{/admin/categories}" th:text="#{admin.action.cancel}">取消</a>
                <button class="btn" type="submit" form="catForm" th:text="#{admin.action.save}">保存修改</button>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments :: icons}"></div>
<script th:replace="~{fragments :: shellJs}"></script>
</body>
</html>
