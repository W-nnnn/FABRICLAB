<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{fragments :: head('admin.nav.albums')}"></head>
<body>
<a class="skip" href="#main" th:text="#{admin.skip}">跳到主要内容</a>
<div class="shell">
    <div th:replace="~{fragments :: side('albums')}"></div>
    <div class="scrim" id="scrim"></div>
    <div class="wrap">
        <div th:replace="~{fragments :: topbar(#{admin.nav.products}, #{admin.nav.albums}, @{/admin/products})}"></div>
        <main class="main" id="main">
            <div class="page">
                <div th:replace="~{fragments :: notice}"></div>

                <div class="ph">
                    <div>
                        <div class="ph__eyebrow"><em>02</em><span th:text="#{admin.nav.products}">商品</span></div>
                        <h1 th:text="#{admin.nav.albums}">服装相册</h1>
                        <p th:text="#{admin.albums.note}">按款号整理平铺、上身、细节三组图片。</p>
                    </div>
                    <div class="ph__act">
                        <span class="ph__count" th:text="#{admin.albums.total(${result.total})}">共 60 款</span>
                    </div>
                </div>

                <div class="toolbar">
                    <form class="search" th:action="@{/admin/albums}" method="get">
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><use href="#i-search"/></svg>
                        <input type="search" name="kw" th:value="${kw}" th:placeholder="#{admin.albums.search}" />
                    </form>
                    <div class="toolbar__right">
                        <a class="txt txt--muted" th:href="@{/admin/albums}" th:text="#{admin.action.resetFilter}">重置筛选</a>
                    </div>
                </div>

                <div class="empty" th:if="${result.total == 0}">
                    <span class="empty__ic"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><use href="#i-search"/></svg></span>
                    <h3 th:text="#{admin.albums.emptyTitle}">没有匹配的款号</h3>
                    <p th:text="#{admin.albums.emptyText}">换个关键词，或清除筛选后重试。</p>
                    <a class="btn btn--sm" th:href="@{/admin/albums}" th:text="#{admin.action.clear}">清除</a>
                </div>

                <div class="tblwrap" th:unless="${result.total == 0}">
                    <table class="tbl">
                        <caption class="sr-only" th:text="#{admin.albums.caption(${result.total})}">服装相册列表</caption>
                        <colgroup>
                            <col style="width:64px" /><col style="width:130px" /><col />
                            <col class="col-md" style="width:140px" />
                            <col style="width:120px" /><col style="width:130px" />
                        </colgroup>
                        <thead><tr>
                            <th th:text="#{admin.albums.cover}">封面</th>
                            <th th:text="#{admin.prod.colSku}">款号</th>
                            <th th:text="#{admin.prod.colName}">名称 / 面料</th>
                            <th class="col-md" th:text="#{admin.prod.colCategory}">品类</th>
                            <th class="n" th:text="#{admin.albums.shots}">相册张数</th>
                            <th th:text="#{admin.albums.actions}">操作</th>
                        </tr></thead>
                        <tbody>
                        <tr th:each="r : ${result.rows}">
                            <td>
                                <span class="pimg"><img th:src="@{|/${r.coverImage}|}" th:alt="${r.sku}" loading="lazy"
                                                        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='/images/logo.png'}" /></span>
                            </td>
                            <td class="sku"><a th:href="@{/admin/albums/{id}(id=${r.id})}" th:text="${r.sku}">FL-CM-01</a></td>
                            <td><span class="tname">
                                <span class="nm" th:text="${tr.t(r.name)}">山羊绒高领衫</span>
                                <span class="sub" th:text="${tr.t(r.fabricLine)}">山羊绒 100%</span>
                            </span></td>
                            <td class="cat col-md" th:text="${tr.t(r.categoryName)}">居家 / 成衣</td>
                            <td class="n" th:text="${counts.get(r.id)}">0</td>
                            <td><a class="txt" th:href="@{/admin/albums/{id}(id=${r.id})}"
                                   th:text="#{admin.albums.open}">查看相册</a></td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="pgs" style="justify-content:flex-end;margin-top:22px">
                        <span class="pg pg--dir off" th:unless="${result.page > 1}" th:text="#{admin.action.prev}">上一页</span>
                        <a class="pg pg--dir" th:if="${result.page > 1}"
                           th:href="@{/admin/albums(kw=${kw},page=${result.page - 1})}"
                           th:text="#{admin.action.prev}">上一页</a>
                        <a class="pg" th:each="i : ${#numbers.sequence(1, result.pages)}"
                           th:classappend="${i == result.page} ? 'on'" th:text="${i}"
                           th:href="@{/admin/albums(kw=${kw},page=${i})}">1</a>
                        <a class="pg pg--dir" th:if="${result.page < result.pages}"
                           th:href="@{/admin/albums(kw=${kw},page=${result.page + 1})}"
                           th:text="#{admin.action.next}">下一页</a>
                        <span class="pg pg--dir off" th:unless="${result.page < result.pages}" th:text="#{admin.action.next}">下一页</span>
                    </div>
                </div>

                <footer th:replace="~{fragments :: footer}"></footer>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments :: icons}"></div>
<script th:replace="~{fragments :: shellJs}"></script>
</body>
</html>
