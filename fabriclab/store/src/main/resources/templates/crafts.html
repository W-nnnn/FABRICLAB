<!DOCTYPE html>
<html lang="zh-CN" th:lang="${lang == 'en' ? 'en' : 'zh-CN'}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" th:href="@{/images/mark.png}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|#{nav.brand} · #{crafts.title}|">FABRICLAB · 工艺说明</title>
    <link rel="stylesheet" th:href="@{/css/store.css?v=20261114a}"/>
</head>
<body th:classappend="${lang == 'en' ? 'lang-en' : 'lang-cn'}">
<div class="page">

    <th:block th:replace="~{fragments :: header('shop')}"></th:block>

    <span id="main" tabindex="-1"></span>

    <div class="crumb">
        <a th:href="@{/main}" th:text="#{nav.home}">首页</a>
        <span> / </span>
        <span th:text="#{crafts.title}">工艺说明</span>
    </div>

    <!-- 页头 -->
    <div style="padding:26px var(--gx) 30px">
        <div class="eyebrow" th:text="#{crafts.eyebrow}">CRAFT NOTES</div>
        <h1 class="h2" style="margin-top:12px;font-size:38px" th:text="#{crafts.title}">工艺说明</h1>
        <div class="lead" style="margin-top:14px;width:460px;font-size:12px;line-height:1.95"
             th:text="#{crafts.lead}">染、织、裁、缝四步，是每一件成衣经过的完整路径；页尾是当季在售的成品。</div>
    </div>
    <div style="margin:0 var(--gx);height:1px;background:var(--ink)"></div>

    <!-- 四段工艺 -->
    <th:block th:each="n, st : ${#numbers.sequence(1, 4)}">
        <section style="padding:44px var(--gx) 50px;border-bottom:1px solid var(--line);
                        display:grid;grid-template-columns:120px minmax(0,1fr);gap:28px"
                 th:with="k=${'crafts.n' + n}">
            <div>
                <div class="disp" style="font-size:44px;line-height:1.1"
                     th:text="#{home.craft__${n}__.t}">染</div>
                <div class="tiny" style="margin-top:10px;letter-spacing:.18em"
                     th:text="#{home.craft__${n}__.d}">不过染缸</div>
            </div>
            <div style="max-width:560px">
                <div class="tiny" style="letter-spacing:.18em;color:var(--mute)"
                     th:text="${#numbers.formatInteger(st.count, 2)}">01</div>
                <p class="lead" style="margin-top:14px;font-size:12.5px;line-height:1.95"
                   th:text="#{__${k}__}">工艺说明正文</p>
            </div>
        </section>
    </th:block>

    <!-- 在售成品条 -->
    <section style="padding:44px var(--gx) 50px">
        <div style="display:flex;align-items:baseline;gap:16px">
            <h2 class="h3" style="font-size:20px" th:text="#{crafts.samples}">当季在售</h2>
            <div class="r" style="margin-left:auto">
                <a class="tlink mute" th:href="@{/category}" th:text="#{crafts.all}">看全部商品 →</a>
            </div>
        </div>
        <div class="g4" style="margin-top:26px" th:if="${!#lists.isEmpty(samples)}">
            <th:block th:each="p, s : ${samples}">
                <a th:replace="~{fragments :: card(${p}, ${#numbers.formatInteger(s.count, 2)})}"></a>
            </th:block>
        </div>
    </section>

    <div style="height:86px"></div>
    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
</body>
</html>
