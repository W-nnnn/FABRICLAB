<!DOCTYPE html>
<html lang="zh-CN" th:lang="${lang == 'en' ? 'en' : 'zh-CN'}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" th:href="@{/images/mark.png}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|#{nav.brand} · #{svc.ask}|">FABRICLAB · 发起咨询</title>
    <link rel="stylesheet" th:href="@{/css/store.css?v=20261116b}"/>
</head>
<body th:classappend="${lang == 'en' ? 'lang-en' : 'lang-cn'}">
<div class="page">

    <th:block th:replace="~{fragments :: header('account')}"></th:block>
    <span id="main" tabindex="-1"></span>

    <div class="crumb">
        <a th:href="@{/service}" th:text="#{svc.title}">客服中心</a><span> / </span>
        <a th:href="@{/service/threads}" th:text="#{svc.myThreads}">我的咨询</a><span> / </span>
        <span th:text="#{svc.ask}">发起咨询</span>
    </div>

    <section class="svc-formwrap">
        <div>
            <div class="eyebrow" th:text="#{svc.formEyebrow}">NEW ENQUIRY / 新建咨询</div>
            <h1 class="h2" th:text="#{svc.ask}">发起咨询</h1>
            <p class="lead" th:text="#{svc.formLead}">写清楚款号或订单号，客服回复会直接出现在这条对话里。</p>
        </div>

        <div class="svc-notice svc-notice--err" role="alert" th:if="${error != null}" th:text="${error}">请填写咨询主题</div>

        <form class="svc-form" th:action="@{/service/threads}" method="post" novalidate>
            <input type="hidden" name="_csrf" th:value="${csrfToken}"/>

            <div class="svc-f" th:classappend="${errorField == 'category'} ? 'err'">
                <label class="svc-f__lb" th:text="#{svc.f.category}">咨询类别</label>
                <div class="svc-opts">
                    <label class="svc-opt" th:each="c : ${categories}">
                        <input type="radio" name="category" th:value="${c.name()}"
                               th:checked="${form.category() == c.name()}"/>
                        <span th:text="#{__${c.labelKey()}__}">尺码版型</span>
                    </label>
                </div>
            </div>

            <div class="svc-f" th:classappend="${errorField == 'subject'} ? 'err'">
                <label class="svc-f__lb" for="subject" th:text="#{svc.f.subject}">主题</label>
                <input id="subject" type="text" name="subject" maxlength="60" th:value="${form.subject()}"
                       th:placeholder="#{svc.f.subjectPh}" th:aria-invalid="${errorField == 'subject'} ? 'true' : 'false'"/>
                <span class="svc-f__hint" th:text="#{svc.f.subjectHint}">一句话说明问题，最长 60 字</span>
            </div>

            <div class="svc-f" th:classappend="${errorField == 'body'} ? 'err'">
                <label class="svc-f__lb" for="body" th:text="#{svc.f.body}">详细内容</label>
                <textarea id="body" name="body" rows="4" maxlength="1000" th:text="${form.body()}"
                          th:placeholder="#{svc.f.bodyPh}"
                          th:aria-invalid="${errorField == 'body'} ? 'true' : 'false'"></textarea>
                <span class="svc-f__hint" th:text="#{svc.f.bodyHint}">不要填写口令、证件号等敏感信息，最长 1000 字</span>
            </div>

            <div class="svc-f__pair">
                <div class="svc-f" th:classappend="${errorField == 'orderNo'} ? 'err'">
                    <label class="svc-f__lb" for="orderNo" th:text="#{svc.f.orderNo}">相关订单号（选填）</label>
                    <input id="orderNo" type="text" name="orderNo" maxlength="40" th:value="${form.orderNo()}"
                           th:placeholder="#{svc.f.orderNoPh}"/>
                    <span class="svc-f__hint" th:text="#{svc.f.orderNoHint}">须为本人完整订单号</span>
                </div>
                <div class="svc-f" th:classappend="${errorField == 'sku'} ? 'err'">
                    <label class="svc-f__lb" for="sku" th:text="#{svc.f.sku}">相关款号（选填）</label>
                    <input id="sku" type="text" name="sku" maxlength="40" th:value="${form.sku()}"
                           th:placeholder="FL-CM-01"/>
                    <span class="svc-f__hint" th:text="#{svc.f.skuHint}">商品详情页可一键带入</span>
                </div>
            </div>

            <div class="svc-form__foot">
                <button class="btn" type="submit" th:text="#{svc.f.submit}">提交咨询</button>
                <a class="tlink mute" th:href="@{/service/threads}" th:text="#{svc.f.cancel}">取消</a>
                <span class="tiny" th:text="#{svc.f.note}">回复由平台管理员在后台处理</span>
            </div>
        </form>
    </section>

    <div style="height:86px"></div>
    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
</body>
</html>
