<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="|${brand} · 商品列表|">FABRICLAB · 商品列表</title>
    <link rel="stylesheet" th:href="@{/css/store.css}" />
</head>
<body class="catalog-page">
<header class="site-header">
    <div class="shell header-top">
        <a class="brand" th:href="@{/main}">
            <img th:src="@{/images/logo.png}" alt="FABRICLAB 标志" />
            <span><b th:text="${brand}">FABRICLAB</b><small th:text="${tagline}">未染</small></span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a th:href="@{/main}">首页</a>
            <a class="is-active" th:href="@{/category}">选购</a>
        </nav>
    </div>
    <div class="shell search-row">
        <form th:action="@{/category}" method="get" role="search">
            <input type="text" name="keyword" maxlength="120" placeholder="搜索成衣或配饰名称"
                   th:value="${query.keyword()}" aria-label="搜索商品名称" />
            <input type="submit" value="搜索" />
        </form>
    </div>
</header>

<main class="shell catalog-main">
    <nav class="catalog-crumb" aria-label="当前条件">
        <a th:href="@{/category}">全部商品</a>
        <span th:if="${result.scope().selectedLine() != null}" class="crumb-sep">/</span>
        <a th:if="${result.scope().selectedLine() != null}"
           th:href="@{/category(category=${result.scope().selectedLine().id})}"
           th:text="${result.scope().selectedLine().name}">通勤出行</a>
        <span th:if="${result.scope().entryIsSecondLevel()}" class="crumb-sep">/</span>
        <span th:if="${result.scope().entryIsSecondLevel()}">
            <a th:href="@{/category(category=${result.scope().entry().id})}"
               th:text="${result.scope().entry().name}">通勤成衣</a>
        </span>
        <span class="crumb-type" th:text="${result.scope().typeLabel()}">全部</span>
        <span class="crumb-keyword" th:if="${query.keyword() != null}"
              th:text="|关键字：${query.keyword()}|">关键字</span>
    </nav>

    <aside class="catalog-sidebar">
        <h2>商品分类</h2>
        <nav aria-label="分类导航">
            <a th:href="@{/category}"
               th:classappend="${result.scope().selectedLine() == null} ? 'is-active'">全部商品</a>
            <th:block th:each="branch : ${lines}">
                <a th:href="@{/category(category=${branch.line().id})}"
                   th:classappend="${result.scope().selectedLine()?.id == branch.line().id} ? 'is-active'"
                   th:text="${branch.line().name}">通勤出行</a>
                <a class="child" th:each="child : ${branch.children()}"
                   th:href="@{/category(category=${child.id})}"
                   th:text="${child.name}">通勤成衣</a>
            </th:block>
        </nav>
    </aside>

    <section class="catalog-results">
        <form class="catalog-filter" th:action="@{/category}" method="get">
            <input type="hidden" name="category" th:if="${result.scope().entry() != null}"
                   th:value="${result.scope().entry().id}" />
            <fieldset class="filter-types">
                <legend>类型</legend>
                <label><input type="radio" name="productType" value="ALL"
                              th:checked="${result.scope().selectedType().name() == 'ALL'}" /> 全部</label>
                <label><input type="radio" name="productType" value="GARMENTS"
                              th:checked="${result.scope().selectedType().name() == 'GARMENTS'}" /> 成衣</label>
                <label><input type="radio" name="productType" value="ACCESSORIES"
                              th:checked="${result.scope().selectedType().name() == 'ACCESSORIES'}" /> 配饰</label>
            </fieldset>
            <label class="filter-sort">排序
                <select name="sort">
                    <option value="DEFAULT" th:selected="${query.sort().name() == 'DEFAULT'}">默认排序</option>
                    <option value="PRICE_ASC" th:selected="${query.sort().name() == 'PRICE_ASC'}">价格从低到高</option>
                    <option value="PRICE_DESC" th:selected="${query.sort().name() == 'PRICE_DESC'}">价格从高到低</option>
                    <option value="NEWEST" th:selected="${query.sort().name() == 'NEWEST'}">新品优先</option>
                </select>
            </label>
            <label class="filter-keyword">关键字
                <input type="text" name="keyword" maxlength="120" th:value="${query.keyword()}" />
            </label>
            <button type="submit">查询</button>
        </form>

        <div class="catalog-results-info" th:if="${result.page.total > 0}"
             th:with="first=${(result.page.current - 1) * query.size() + 1},
                      last=${(result.page.current - 1) * query.size() + result.page.records.size()}">
            <b th:text="${result.scope().selectedLine() != null ? result.scope().selectedLine().name : '全部商品'}">全部商品</b>
            <span th:text="|显示 ${first}–${last}，共 ${result.page.total} 件|">显示 1–6，共 0 件</span>
        </div>

        <div class="product-grid" th:if="${!result.page.records.isEmpty()}">
            <th:block th:each="p : ${result.page.records}">
                <a th:replace="~{fragments :: productCard(${p})}"></a>
            </th:block>
        </div>

        <div class="empty-block" th:if="${result.page.records.isEmpty()}">
            <p>未找到匹配的商品</p>
            <p th:if="${result.page.total == 0}">
                当前条件：<span
                    th:text="${result.scope().selectedLine() != null ? result.scope().selectedLine().name : '全部分类'}">全部分类</span>
                · <span th:text="${result.scope().typeLabel()}">全部</span>
                <span th:if="${query.keyword() != null}" th:text="|· 关键字「${query.keyword()}」|"></span>
                <a class="empty-action" th:href="@{/category}">清空筛选</a>
            </p>
            <p th:if="${result.page.total > 0}">
                页码超出末页，共 <span th:text="${result.page.pages}">0</span> 页。
                <a class="empty-action"
                   th:href="@{/category(category=${query.categoryId()}, productType=${query.productTypeParam()},
                       sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                       keyword=${query.keyword()}, size=${query.size()}, page=${result.page.pages})}">返回最后一页</a>
            </p>
        </div>

        <nav class="pager" aria-label="分页" th:if="${result.page.pages > 1 and result.page.total > 0}">
            <a th:if="${query.page() > 1}"
               th:href="@{/category(category=${query.categoryId()}, productType=${query.productTypeParam()},
                   sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                   keyword=${query.keyword()}, size=${query.size()}, page=${query.page() - 1})}">上一页</a>
            <span th:text="|第 ${query.page()} / ${result.page.pages} 页|">第 1 / 1 页</span>
            <a th:if="${query.page() < result.page.pages}"
               th:href="@{/category(category=${query.categoryId()}, productType=${query.productTypeParam()},
                   sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                   keyword=${query.keyword()}, size=${query.size()}, page=${query.page() + 1})}">下一页</a>
        </nav>
    </section>
</main>

<footer class="site-footer">
    <div class="shell">
        <span th:text="${brand}">FABRICLAB</span>
        <span th:text="${tagline}">未染</span>
    </div>
</footer>
</body>
</html>
