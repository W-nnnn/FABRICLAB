<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|#{nav.brand} · #{shop.title}|">FABRICLAB · 全部商品</title>
    <link rel="stylesheet" th:href="@{/css/store.css?v=20261113f}"/>
</head>
<body th:classappend="${lang == 'en' ? 'lang-en' : 'lang-cn'}">
<div class="page">

    <th:block th:replace="~{fragments :: header(null)}"></th:block>

    <div class="crumb">
        <a th:href="@{/main}" th:text="#{nav.home}">首页</a>
        <span> / </span>
        <a th:href="@{/category}" th:text="#{nav.shop}">选购</a>
        <span> / </span>
        <a th:if="${result.scope().selectedLine() != null}"
           th:href="@{/category(category=${result.scope().selectedLine().id})}"
           th:text="${tr.t(result.scope().selectedLine().name)}">通勤</a>
        <span th:if="${result.scope().entryIsSecondLevel()}"> / </span>
        <a th:if="${result.scope().entryIsSecondLevel()}"
           th:href="@{/category(category=${result.scope().entry().id})}"
           th:text="${tr.t(result.scope().entry().name)}">通勤成衣</a>
        <span th:if="${result.scope().selectedLine() == null}" th:text="#{shop.all}">全部商品</span>
    </div>

    <!-- 页头 -->
    <div style="padding:26px var(--gx) 30px;display:flex;align-items:flex-end">
        <div>
            <div class="eyebrow" th:text="#{shop.eyebrow}">全部商品 / FW26</div>
            <div class="h2" style="margin-top:12px;font-size:38px"
                 th:if="${result.scope().selectedLine() != null}"
                 th:text="${tr.t(result.scope().selectedLine().name)}">全部商品</div>
            <div class="h2" style="margin-top:12px;font-size:38px"
                 th:unless="${result.scope().selectedLine() != null}"
                 th:text="#{shop.all}">全部商品</div>
        </div>
        <div class="lead" style="margin:0 0 4px 40px;width:420px;font-size:12px"
             th:text="#{shop.lead}">四十二件，本季新增七件。卖完不补，不再开版。</div>
        <div style="margin-left:auto;display:flex;align-items:baseline;gap:10px">
            <span class="din" style="font-size:40px;font-weight:700;letter-spacing:-.03em"
                  th:text="${result.page.total}">42</span>
            <span class="tiny" style="padding-bottom:7px" th:text="#{shop.count}">在售件数</span>
        </div>
    </div>
    <div style="margin:0 var(--gx);height:1px;background:var(--ink)"></div>

    <!-- 计数 + 排序 -->
    <div style="padding:20px var(--gx) 0;display:flex;align-items:center;gap:14px">
        <span class="tiny" th:text="#{shop.range}">FW26 第七辑</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:22px;
                    font-family:var(--f-body);font-size:10px;letter-spacing:.14em;color:var(--mute)">
            <span th:text="#{shop.sort}">排序</span>
            <a th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                        productType=${query.productTypeParam()}, keyword=${query.keyword()}, size=${query.size()},
                        sort='NEWEST')}"
               th:style="${query.sort().name() == 'NEWEST'}
                         ? 'color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:4px'
                         : 'padding-bottom:4px'"
               th:text="#{shop.sort.new}">新品优先</a>
            <a th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                        productType=${query.productTypeParam()}, keyword=${query.keyword()}, size=${query.size()},
                        sort='PRICE_ASC')}"
               th:style="${query.sort().name() == 'PRICE_ASC'}
                         ? 'color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:4px'
                         : 'padding-bottom:4px'"
               th:text="#{shop.sort.asc}">价格升序</a>
            <a th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                        productType=${query.productTypeParam()}, keyword=${query.keyword()}, size=${query.size()},
                        sort='PRICE_DESC')}"
               th:style="${query.sort().name() == 'PRICE_DESC'}
                         ? 'color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:4px'
                         : 'padding-bottom:4px'"
               th:text="#{shop.sort.desc}">价格降序</a>
        </div>
    </div>

    <!-- 当前条件 -->
    <div style="padding:16px var(--gx) 0;display:flex;align-items:center;gap:8px">
        <span class="tiny" style="letter-spacing:.18em;margin-right:8px" th:text="#{shop.filtered}">已筛选</span>
        <span class="chip on" th:if="${result.scope().selectedLine() != null}">
            <span th:text="${tr.t(result.scope().selectedLine().name)}">通勤</span>
            <a th:href="@{/category}" style="margin-left:2px">×</a>
        </span>
        <span class="chip on" th:if="${result.scope().entryIsSecondLevel()}">
            <span th:text="${tr.t(result.scope().entry().name)}">成衣</span>
            <a th:href="@{/category(category=${result.scope().selectedLine().id})}" style="margin-left:2px">×</a>
        </span>
        <span class="chip" th:if="${result.scope().selectedType().name() != 'ALL'}"
              th:text="${tr.t(result.scope().typeLabel())}">成衣</span>
        <span class="chip" th:if="${query.keyword() != null}" th:text="|#{shop.keyword} ${query.keyword()}|">关键字</span>
        <a class="tlink mute plain" style="font-size:10px;color:var(--rust);margin-left:6px"
           th:href="@{/category}" th:text="#{shop.clear}">清除</a>
        <span class="tiny" style="margin-left:auto;letter-spacing:.16em"
              th:text="|#{shop.showing} ${result.page.total}|">共 42 件</span>
    </div>

    <!-- 两栏：目录面板 + 商品网格 -->
    <div style="display:flex;padding:30px var(--gx) 0;gap:48px;align-items:flex-start">
        <div class="catpanel">
            <div>
                <div class="cap" th:text="#{shop.f.category}">系列线</div>
                <div class="catline" th:classappend="${result.scope().selectedLine() == null} ? 'on'">
                    <a th:href="@{/category}" th:text="#{shop.all}">全部商品</a>
                </div>
                <th:block th:each="branch, b : ${lines}">
                    <div class="catline"
                         th:classappend="${result.scope().selectedLine() != null
                                          and result.scope().selectedLine().id == branch.line().id} ? 'on'">
                        <a th:href="@{/category(category=${branch.line().id})}"
                           th:text="${tr.t(branch.line().name)}">通勤</a>
                    </div>
                    <div class="catsub"
                         th:classappend="${result.scope().entryIsSecondLevel()
                                          and result.scope().entry().id == child.id} ? 'on'"
                         th:each="child : ${branch.children()}">
                        <a th:href="@{/category(category=${child.id})}"
                           th:text="${tr.t(child.name)}">成衣</a>
                    </div>
                </th:block>
            </div>

            <div style="margin-top:24px">
                <div class="cap" th:text="#{shop.f.type}">类型</div>
                <div class="seg">
                    <a th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                                keyword=${query.keyword()},
                                sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                                size=${query.size()})}"
                       th:classappend="${result.scope().selectedType().name() == 'ALL'} ? 'on'"
                       th:text="#{shop.type.all}">全部</a>
                    <a th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                                productType='GARMENTS', keyword=${query.keyword()},
                                sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                                size=${query.size()})}"
                       th:classappend="${result.scope().selectedType().name() == 'GARMENTS'} ? 'on'"
                       th:text="#{shop.type.garment}">成衣</a>
                    <a th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                                productType='ACCESSORIES', keyword=${query.keyword()},
                                sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                                size=${query.size()})}"
                       th:classappend="${result.scope().selectedType().name() == 'ACCESSORIES'} ? 'on'"
                       th:text="#{shop.type.acc}">配饰</a>
                </div>
            </div>

            <div style="margin-top:24px">
                <div class="cap" th:text="#{shop.f.colour}">颜色</div>
                <div style="display:flex;flex-wrap:wrap;gap:10px">
                    <span style="width:19px;height:19px;border-radius:50%;background:#57554F;
                                 box-shadow:0 0 0 1px rgba(26,26,26,.16)"></span>
                    <span style="width:19px;height:19px;border-radius:50%;background:#BFA98B;
                                 box-shadow:0 0 0 1px rgba(26,26,26,.16)"></span>
                    <span style="width:19px;height:19px;border-radius:50%;background:#4B3B31;
                                 box-shadow:0 0 0 1px rgba(26,26,26,.16)"></span>
                    <span style="width:19px;height:19px;border-radius:50%;background:#20201E;
                                 box-shadow:0 0 0 1px rgba(26,26,26,.16)"></span>
                    <span style="width:19px;height:19px;border-radius:50%;background:#EDE8DC;
                                 box-shadow:0 0 0 1px rgba(26,26,26,.16)"></span>
                    <span style="width:19px;height:19px;border-radius:50%;background:#5D7285;
                                 box-shadow:0 0 0 1px rgba(26,26,26,.16)"></span>
                </div>
            </div>

            <form th:action="@{/category}" method="get" style="margin-top:24px">
                <input type="hidden" name="category" th:if="${result.scope().entry() != null}"
                       th:value="${result.scope().entry().id}"/>
                <input type="hidden" name="productType" th:value="${query.productTypeParam()}"/>
                <div class="cap" th:text="#{shop.f.keyword}">关键字</div>
                <div class="field" style="margin-bottom:14px;padding-bottom:8px">
                    <input type="text" name="keyword" maxlength="120" th:value="${query.keyword()}"
                           th:placeholder="#{nav.search}" th:aria-label="#{shop.f.keyword}"/>
                </div>
                <button type="submit" class="tlink" style="font-size:10px" th:text="#{shop.apply}">查询</button>
            </form>

            <div style="border-top:1px solid var(--line);padding-top:16px;margin-top:22px">
                <a class="tlink mute" style="font-size:10px" th:href="@{/category}"
                   th:text="#{shop.clear.all}">清除筛选</a>
            </div>
        </div>

        <div style="flex:1;min-width:0">
            <div class="g4" th:if="${!result.page.records.isEmpty()}">
                <th:block th:each="p, s : ${result.page.records}">
                    <a th:replace="~{fragments :: card(${p}, ${#numbers.formatInteger(s.count, 2)})}"></a>
                </th:block>
            </div>

            <div class="empty" style="padding:70px 0 0" th:if="${result.page.records.isEmpty()}">
                <h2 th:text="#{shop.empty.title}">没有找到匹配的商品</h2>
                <p th:if="${result.page.total == 0 and query.page() == 1}" th:text="#{shop.empty.body}">
                    当前筛选条件下没有在售商品，可以清除条件重新浏览。
                </p>
                <p th:if="${result.page.total > 0}" th:text="#{shop.empty.page}">该页超出末页，请返回有效页码。</p>
                <div class="acts">
                    <a class="btn" th:href="@{/category}" th:text="#{shop.clear.all}">清除筛选</a>
                </div>
            </div>

            <div style="margin-top:52px;display:flex;align-items:center;gap:24px;
                        font-family:var(--f-din);font-size:10px;letter-spacing:.18em">
                <a class="pglink" th:if="${query.page() > 1}"
                   th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                               productType=${query.productTypeParam()},
                               sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                               keyword=${query.keyword()}, size=${query.size()}, page=${query.page() - 1})}"
                   th:text="#{shop.prev}">上一页</a>
                <span style="color:var(--ink)" th:text="${#numbers.formatInteger(query.page(), 2)}">01</span>
                <span style="color:var(--faint)" th:text="${#numbers.formatInteger(result.page.pages, 2)}">01</span>
                <a class="pglink" style="margin-left:auto" th:if="${query.page() < result.page.pages}"
                   th:href="@{/category(category=${result.scope().entry() != null ? result.scope().entry().id : null},
                               productType=${query.productTypeParam()},
                               sort=${query.sort().name() == 'DEFAULT' ? null : query.sort().name()},
                               keyword=${query.keyword()}, size=${query.size()}, page=${query.page() + 1})}"
                   th:text="#{shop.next}">下一页 →</a>
            </div>
        </div>
    </div>

    <div style="height:86px"></div>
    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
</body>
</html>
