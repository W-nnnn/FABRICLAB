<!DOCTYPE html>
<html lang="zh-CN" th:lang="${lang == 'en' ? 'en' : 'zh-CN'}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" th:href="@{/images/mark.png}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|#{nav.brand} · #{svc.title}|">FABRICLAB · 客服中心</title>
    <link rel="stylesheet" th:href="@{/css/store.css?v=20261116m}"/>
</head>
<body th:classappend="${lang == 'en' ? 'lang-en' : 'lang-cn'}">
<div class="page">

    <th:block th:replace="~{fragments :: header('service')}"></th:block>
    <span id="main" tabindex="-1"></span>

    <div class="crumb">
        <a th:href="@{/main}" th:text="#{nav.home}">首页</a><span> / </span>
        <span th:text="#{svc.title}">客服中心</span>
    </div>

    <section class="svc-page">
        <div class="svc-head">
            <div>
                <div class="eyebrow" th:text="#{svc.eyebrow}">CLIENT CARE / 客服中心</div>
                <h1 th:text="#{svc.title}">客服中心</h1>
                <p th:text="#{svc.lead}">尺码、面料、下单与到店试穿；有疑问直接留一条咨询。</p>
            </div>
            <div class="svc-head__act">
                <span class="svc-count" th:if="${openCount != null}" th:text="#{svc.openCount(${openCount})}">待回复 2 条</span>
                <a class="btn" th:if="${currentUser != null}" th:href="@{/service/threads/new}" th:text="#{svc.ask}">发起咨询</a>
                <a class="btn" th:if="${currentUser == null}" th:href="@{/signon(returnTo='/service/threads/new')}"
                   th:text="#{svc.askSignon}">登录后咨询</a>
                <a class="tlink" th:if="${currentUser != null}" th:href="@{/service/threads}"
                   th:text="#{svc.myThreads}">我的咨询 →</a>
            </div>
        </div>

        <div class="svc-strip">
            <span><b th:text="#{svc.scopeTitle}">服务范围</b>　<span th:text="#{svc.scope}">售前选购咨询</span></span>
            <span><b th:text="#{svc.channelTitle}">其他联系方式</b>　<span th:utext="#{svc.channel}">门店与邮箱</span></span>
        </div>

        <section class="svc-faqs">
            <div class="svc-sec__head">
                <h2 th:text="#{svc.faqTitle}">常见问题</h2>
                <span class="tiny" th:text="#{svc.faqNote}">按本站实际功能作答</span>
            </div>
            <article class="svc-faq" th:each="f, s : ${faqs}">
                <span class="svc-faq__no" th:text="${#numbers.formatInteger(s.count, 2)}">01</span>
                <div>
                    <h3 th:text="#{__${f.qKey}__}">问题</h3>
                    <p th:text="#{__${f.aKey}__}">回答</p>
                </div>
                <a class="tlink" th:href="@{/service/threads/new(category=${f.category})}"
                   th:text="#{svc.faqAsk}">按此咨询 →</a>
            </article>
        </section>

        <div class="svc-endnote" th:text="#{svc.note}">咨询与回复保存在本站演示库中。</div>
    </section>

    <div style="height:86px"></div>
    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
</body>
</html>
