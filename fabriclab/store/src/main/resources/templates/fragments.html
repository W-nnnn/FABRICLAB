<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="authZone">
    <a class="nav-cart" th:href="@{/cart}">
        购物车
        <b class="nav-cart__badge" th:text="${cartBadge == null ? 0 : cartBadge}">0</b>
    </a>
    <th:block th:if="${currentUser == null}">
        <a th:href="@{/signon}">登录</a>
        <a th:href="@{/register}">注册</a>
    </th:block>
    <th:block th:if="${currentUser != null}">
        <span class="nav-user" th:text="${currentUser.displayName()}">显示名</span>
        <form class="nav-signout" th:action="@{/signout}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrfToken}" />
            <button type="submit">退出</button>
        </form>
    </th:block>
</th:block>
<a th:fragment="productCard(product)" class="product-card" th:href="@{/product(id=${product.id})}">
    <span class="product-card__media">
        <img th:src="${#strings.isEmpty(product.coverImage) ? '/images/logo.png' : '/' + product.coverImage}"
             th:alt="${product.name}" loading="lazy" />
    </span>
    <span class="product-card__name" th:text="${product.name}">商品名称</span>
    <span class="product-card__summary" th:if="${!#strings.isEmpty(product.summary)}"
          th:text="${product.summary}">简介</span>
    <span class="product-card__meta">
        <strong th:text="|¥ ${#numbers.formatDecimal(product.price, 1, 2)}|">¥ 0.00</strong>
        <b class="stock stock--ok" th:if="${product.stock > 0}">现货</b>
        <b class="stock stock--out" th:if="${product.stock == 0}">暂时缺货</b>
    </span>
    <span class="product-card__link">查看详情</span>
</a>
</body>
</html>
