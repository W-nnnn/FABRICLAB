<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|#{nav.brand} · #{error.title}|">FABRICLAB · 提示</title>
    <link rel="stylesheet" th:href="@{/css/store.css?v=20261113i}"/>
</head>
<body th:classappend="${lang == 'en' ? 'lang-en' : 'lang-cn'}">
<div class="page">

    <th:block th:replace="~{fragments :: header(null)}"></th:block>

    <div style="padding:110px var(--gx) 90px;display:flex;align-items:center;gap:70px">
        <div style="flex:1">
            <div class="din" style="font-size:120px;font-weight:700;letter-spacing:-.04em;line-height:.86"
                 th:text="${statusCode != null ? statusCode : (status != null ? status : 500)}">404</div>
            <div class="h2" style="margin-top:26px;font-size:34px"
                 th:if="${errorTitle != null}" th:text="${tr.t(errorTitle)}">页面不存在</div>
            <div class="h2" style="margin-top:26px;font-size:34px"
                 th:unless="${errorTitle != null}" th:text="#{error.notfound.title}">页面不存在</div>
            <div class="lead" style="margin-top:18px;width:440px;font-size:12.5px"
                 th:if="${errorMessage != null}" th:text="${tr.t(errorMessage)}">
                链接可能失效，或者这件已经卖完下架。
            </div>
            <div class="lead" style="margin-top:18px;width:440px;font-size:12.5px"
                 th:unless="${errorMessage != null}" th:text="#{error.notfound.body}">
                链接可能失效，或者这件已经卖完下架。
            </div>
            <div style="margin-top:34px;display:flex;gap:12px">
                <a class="btn" th:href="@{/main}" th:text="#{error.home}">返回首页</a>
                <a class="btn ghost" th:href="@{/category}">
                    <span th:text="#{error.shop}">返回商品列表</span>
                    <svg width="14" height="9" viewBox="0 0 15 9" fill="none" stroke="currentColor"
                         stroke-width="1.2"><path d="M0 4.5h13.4M9.8 1l3.6 3.5-3.6 3.5"/></svg>
                </a>
            </div>
            <div style="margin-top:44px;display:flex;align-items:center;gap:26px">
                <span class="tiny" style="letter-spacing:.2em" th:text="#{error.try}">也可以去</span>
                <a class="tlink mute" th:href="@{/category}" th:text="#{error.try1}">全部商品</a>
                <a class="tlink mute" th:href="@{/orders}" th:text="#{error.try2}">我的订单</a>
                <a class="tlink mute" th:href="@{/cart}" th:text="#{error.try3}">购物袋</a>
            </div>
        </div>
        <div style="width:520px;flex:none;aspect-ratio:4/5;overflow:hidden;background:var(--linen)">
            <img th:src="@{/images/look/lb-10.jpg}" alt="" loading="lazy"
                 style="width:100%;height:100%;object-fit:cover;object-position:50% 20%"/>
        </div>
    </div>

    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
</body>
</html>
