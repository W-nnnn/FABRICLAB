<!DOCTYPE html>
<html lang="zh-CN" th:lang="${lang == 'en' ? 'en' : 'zh-CN'}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" th:href="@{/images/mark.png}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|#{nav.brand} · #{cart.title}|">FABRICLAB · 购物袋</title>
    <link rel="stylesheet" th:href="@{/css/store.css?v=20261116v}"/>
</head>
<body class="pg-cart" th:classappend="${lang == 'en' ? 'lang-en' : 'lang-cn'}">
<div class="page">

    <th:block th:replace="~{fragments :: header(null)}"></th:block>

    <span id="main" tabindex="-1"></span>
    <p class="flash warn" th:if="${cartError != null}" th:text="${tr.t(cartError)}">提示</p>

    <!-- 空袋 -->
    <div class="empty" th:if="${view.empty}">
        <h2 th:text="#{cart.empty.title}">购物车是空的</h2>
        <p th:text="#{cart.empty.body}">先去挑选几件喜欢的成衣吧，加入后可以随时回来结算。</p>
        <div class="acts">
            <a class="btn" th:href="@{/category}" th:text="#{cart.empty.cta}">去选购</a>
        </div>
    </div>

    <th:block th:unless="${view.empty}">
        <div class="cart-head">
            <div>
                <div class="eyebrow" th:text="#{cart.eyebrow}">购物袋</div>
                <h1 class="h2 cart-head__title"
                    th:text="|#{cart.bag} (${view.lines.size()})|">购物袋 (1)</h1>
            </div>
            <div class="cart-steps">
                <th:block th:replace="~{fragments :: steps(1)}"></th:block>
            </div>
        </div>

        <p class="flash warn" th:if="${view.hasInvalid}" th:text="#{cart.invalid}">
            购物车包含失效条目，暂时不能整车结算；失效条目仍会保留，可移除后再结算。
        </p>

        <div class="cart-layout">
            <section class="cart-list">
                <div class="cart-lhead">
                    <span class="cart-lhead__item" th:text="#{cart.col.item}">商品</span>
                    <span th:text="#{cart.unit}">单价</span>
                    <span th:text="#{cart.qty.aria}">购买数量</span>
                    <span class="cart-lhead__amt" th:text="#{cart.total}">金额</span>
                </div>

                <div class="cart-row" th:each="line : ${view.lines}"
                     th:classappend="${line.unavailable} ? 'invalid'">
                    <a class="cart-thumb" th:href="@{/product(id=${line.productId})}">
                        <img th:src="${#strings.isEmpty(line.coverImage) ? '/images/mark.png' : '/' + line.coverImage}"
                             th:alt="${tr.t(line.name)}" loading="lazy"/>
                    </a>
                    <div class="cart-info">
                        <a class="cart-name" th:href="@{/product(id=${line.productId})}"
                           th:text="${tr.t(line.name)}">商品名称</a>
                        <div class="cart-sku" th:text="${line.sku}">FL-CM-01</div>
                        <div class="cart-reason" th:if="${line.unavailable}" th:text="${tr.t(line.reason)}">商品已下架</div>
                    </div>
                    <div class="cart-unit" th:text="|#{cart.unit} ¥ ${#numbers.formatDecimal(line.unitPrice, 1, 2)}|">
                        单价 ¥ 0.00
                    </div>
                    <div class="cart-actions">
                        <form th:action="@{/cart/update}" method="post" th:if="${!line.unavailable}">
                            <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                            <input type="hidden" name="itemId" th:value="${line.itemId}"/>
                            <input type="hidden" name="version" th:value="${line.version}"/>
                            <span class="qbox">
                                <input class="qty-input" type="number" name="quantity"
                                       th:value="${line.quantity}" min="1" max="99" step="1"
                                       th:aria-label="#{cart.qty.aria}"/>
                            </span>
                            <button type="submit" class="cart-act" th:text="#{cart.update}">更新</button>
                        </form>
                        <span class="cart-qty-static" th:if="${line.unavailable}" th:text="${line.quantity}">1</span>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                            <input type="hidden" name="itemId" th:value="${line.itemId}"/>
                            <input type="hidden" name="version" th:value="${line.version}"/>
                            <button type="submit" class="cart-act cart-act--mute" th:text="#{cart.remove}">移除</button>
                        </form>
                    </div>
                    <div class="cart-amt">
                        <span th:text="|¥ ${#numbers.formatDecimal(line.subtotal(), 1, 2)}|">¥ 0.00</span>
                    </div>
                </div>

                <div class="cart-note">
                    <span class="cart-note__mk">
                        <svg width="11" height="9" viewBox="0 0 12 9" fill="none" stroke="currentColor"
                             stroke-width="1.5"><path d="M1 4.6L4.3 7.8 11 1.2"/></svg>
                    </span>
                    <span th:text="#{cart.note}">一次结算购物袋里的全部商品；购物袋随账号保存。</span>
                </div>

                <div class="cart-foot">
                    <a class="tlink" data-nav="back" th:href="@{/category}" th:text="#{cart.continue}">← 继续选购</a>
                    <span class="tiny" th:text="#{cart.tax}">价格含税</span>
                </div>
            </section>

            <aside class="cart-summary">
                <div class="cart-sum-card">
                    <div class="cart-sum-title" th:text="#{checkout.summary}">订单摘要</div>
                    <div class="sum">
                        <div class="l"><span th:text="#{cart.subtotal}">商品件数</span>
                            <b th:text="|${view.totalQuantity}|">0</b></div>
                        <div class="l"><span th:text="#{cart.payable}">可结算合计</span>
                            <b th:text="|¥ ${#numbers.formatDecimal(view.payableTotal, 1, 2)}|">¥ 0.00</b></div>
                        <div class="l tot"><span th:text="#{cart.total}">合计</span>
                            <b th:text="|¥ ${#numbers.formatDecimal(view.payableTotal, 1, 2)}|">¥ 0.00</b></div>
                    </div>

                    <a class="btn wide cart-checkout" th:if="${!view.hasInvalid}"
                       th:href="@{/checkout}" th:text="#{cart.checkout}">去结算 →</a>
                    <span class="btn wide disabled cart-checkout" th:if="${view.hasInvalid}"
                          th:text="#{cart.checkout}">去结算 →</span>

                    <div class="cart-terms">
                        <div>
                            <span th:text="#{cart.k.ship}">配送</span>
                            <span th:text="#{cart.v.ship}">顺丰包邮 2–3 天</span>
                        </div>
                        <div>
                            <span th:text="#{cart.k.return}">退换</span>
                            <span th:text="#{cart.v.return}">7 天，上门取件</span>
                        </div>
                        <div>
                            <span th:text="#{cart.k.repair}">修补</span>
                            <span th:text="#{cart.v.repair}">终身免费</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <div class="cart-recs">
            <div class="ptitle">
                <div>
                    <div class="eyebrow" th:text="#{cart.rec.eb}">为你而选</div>
                    <h2 class="h2" style="margin-top:14px" th:text="#{cart.rec.title}">和袋里的配一配</h2>
                </div>
                <div class="r">
                    <a class="tlink mute" th:href="@{/category}"
                       th:text="#{cart.rec.more(${onSaleTotal})}">查看全部 42 件</a>
                </div>
            </div>
            <div class="g4">
                <th:block th:each="p, s : ${recommendations}">
                    <a th:replace="~{fragments :: card(${p}, ${#numbers.formatInteger(s.count, 2)})}"></a>
                </th:block>
            </div>
        </div>
    </th:block>

    <div style="height:80px"></div>
    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
</body>
</html>
