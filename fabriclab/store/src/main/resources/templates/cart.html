<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="|${brand} · 我的购物车|">FABRICLAB · 我的购物车</title>
    <link rel="stylesheet" th:href="@{/css/store.css}" />
</head>
<body class="cart-page">
<header class="site-header">
    <div class="shell header-top">
        <a class="brand" th:href="@{/main}">
            <img th:src="@{/images/logo.png}" alt="FABRICLAB 标志" />
            <span><b th:text="${brand}">FABRICLAB</b><small th:text="${tagline}">未染</small></span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a th:href="@{/main}">首页</a>
            <a th:href="@{/category}">选购</a>
            <th:block th:replace="~{fragments :: authZone}"></th:block>
        </nav>
    </div>
</header>

<main class="shell cart-main">
    <h1>我的购物车</h1>

    <p class="cart-flash cart-flash--warn" th:if="${cartError != null}" th:text="${cartError}">提示</p>

    <section class="cart-empty" th:if="${view.empty}">
        <p>购物车是空的，先去挑选几件喜欢的成衣吧。</p>
        <a class="cart-empty__link" th:href="@{/category}">去选购</a>
    </section>

    <th:block th:unless="${view.empty}">
        <p class="cart-flash cart-flash--warn" th:if="${view.hasInvalid}">购物车包含失效条目，暂时不能整车结算；失效条目仍会保留，可移除后再结算。</p>

        <table class="cart-table">
            <thead>
            <tr>
                <th scope="col">商品</th>
                <th scope="col">单价</th>
                <th scope="col">数量</th>
                <th scope="col">小计</th>
                <th scope="col">状态</th>
                <th scope="col">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${view.lines}" th:classappend="${line.unavailable ? 'cart-row--invalid' : ''}">
                <td class="cart-goods">
                    <a class="cart-goods__media" th:href="@{/product(id=${line.productId})}">
                        <img th:src="${#strings.isEmpty(line.coverImage) ? '/images/logo.png' : '/' + line.coverImage}"
                             th:alt="${line.name}" loading="lazy" />
                    </a>
                    <span class="cart-goods__text">
                        <a class="cart-goods__name" th:href="@{/product(id=${line.productId})}" th:text="${line.name}">商品名称</a>
                        <small class="cart-goods__sku" th:if="${line.sku != null}">
                            款号 <code th:text="${line.sku}">FL-000-00</code>
                        </small>
                    </span>
                </td>
                <td th:text="|¥ ${#numbers.formatDecimal(line.unitPrice, 1, 2)}|">¥ 0.00</td>
                <td>
                    <form class="cart-qty" th:action="@{/cart/update}" method="post"
                          th:if="${!line.unavailable}">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}" />
                        <input type="hidden" name="itemId" th:value="${line.itemId}" />
                        <input type="hidden" name="version" th:value="${line.version}" />
                        <input class="cart-qty__input" type="number" name="quantity" th:value="${line.quantity}"
                               min="1" max="99" step="1" aria-label="购买数量" />
                        <button type="submit">更新</button>
                    </form>
                    <span class="cart-qty cart-qty--plain" th:if="${line.unavailable}"
                          th:text="${line.quantity}">1</span>
                </td>
                <td th:text="|¥ ${#numbers.formatDecimal(line.subtotal(), 1, 2)}|">¥ 0.00</td>
                <td class="cart-state">
                    <b class="stock stock--ok" th:if="${!line.unavailable}">可结算</b>
                    <b class="stock stock--out" th:if="${line.unavailable}" th:text="${line.reason}">失效</b>
                </td>
                <td>
                    <form th:action="@{/cart/remove}" method="post" class="cart-remove">
                        <input type="hidden" name="_csrf" th:value="${csrfToken}" />
                        <input type="hidden" name="itemId" th:value="${line.itemId}" />
                        <input type="hidden" name="version" th:value="${line.version}" />
                        <button type="submit">移除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <section class="cart-summary">
            <p>商品件数（含失效条目）<b th:text="${view.totalQuantity}">0</b></p>
            <p>可结算合计 <b class="cart-summary__total" th:text="|¥ ${#numbers.formatDecimal(view.payableTotal, 1, 2)}|">¥ 0.00</b></p>
            <button type="button" class="cart-checkout"
                    th:disabled="${view.hasInvalid}"
                    th:title="${view.hasInvalid ? '购物车包含失效条目，暂时无法整车结算' : '结算功能将在下单任务开放'}">
                去结算
            </button>
            <p class="cart-summary__note" th:unless="${view.hasInvalid}">整车结算功能将在下单任务开放。</p>
            <p class="cart-summary__note">购物车随账号保存，退出或重启应用后重新登录仍会保留；不预占库存。</p>
        </section>
    </th:block>
</main>

<footer class="site-footer">
    <div class="shell">
        <span th:text="${brand}">FABRICLAB</span>
        <span th:text="${tagline}">未染</span>
    </div>
</footer>
</body>
</html>
