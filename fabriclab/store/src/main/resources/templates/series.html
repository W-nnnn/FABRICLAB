<!DOCTYPE html>
<html lang="zh-CN" th:lang="${lang == 'en' ? 'en' : 'zh-CN'}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" th:href="@{/images/mark.png}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|#{nav.brand} · ${tr.t(series.line().name)}|">FABRICLAB · 系列专题</title>
    <link rel="stylesheet" th:href="@{/css/store.css?v=20261114a}"/>
</head>
<body th:classappend="${lang == 'en' ? 'lang-en' : 'lang-cn'}">
<div class="page">

    <th:block th:replace="~{fragments :: header('shop')}"></th:block>

    <span id="main" tabindex="-1"></span>

    <div class="crumb">
        <a th:href="@{/main}" th:text="#{nav.home}">首页</a>
        <span> / </span>
        <a th:href="@{/category}" th:text="#{nav.shop}">选购</a>
        <span> / </span>
        <span th:text="${tr.t(series.line().name)}">通勤出行</span>
    </div>

    <!-- 专题页头 -->
    <div style="padding:26px var(--gx) 30px;display:flex;align-items:flex-end">
        <div>
            <div class="eyebrow" th:text="#{series.eyebrow}">SERIES</div>
            <h1 class="h2" style="margin-top:12px;font-size:38px" th:text="${tr.t(series.line().name)}">通勤出行</h1>
        </div>
        <div class="lead" style="margin:0 0 4px 40px;width:440px;font-size:12px;line-height:1.95"
             th:text="#{series.lead}">系列专题按二级品类归组，只收当季在售款；卖完不补。</div>
        <div style="margin-left:auto;display:flex;align-items:baseline;gap:10px">
            <span class="din" style="font-size:40px;font-weight:700;letter-spacing:-.03em"
                  th:text="${series.total()}">12</span>
            <span class="tiny" style="padding-bottom:7px" th:text="#{series.count}">在售件数</span>
        </div>
    </div>
    <div style="margin:0 var(--gx);height:1px;background:var(--ink)"></div>

    <!-- 按二级品类归组 -->
    <th:block th:each="g, st : ${series.groups()}">
        <section style="padding:40px var(--gx) 46px;border-bottom:1px solid var(--line)">
            <div style="display:flex;align-items:baseline;gap:16px">
                <span class="din" style="font-size:13px;color:var(--mute)"
                      th:text="${#numbers.formatInteger(st.count, 2)}">01</span>
                <h2 class="h3" style="font-size:20px" th:text="${tr.t(g.second().name)}">通勤成衣</h2>
                <div class="r" style="margin-left:auto">
                    <a class="tlink mute"
                       th:href="@{/category(category=${g.second().id})}"
                       th:text="#{series.shopAll}">到分类页选购 →</a>
                </div>
            </div>

            <div class="g4" style="margin-top:26px" th:if="${!#lists.isEmpty(g.products())}">
                <th:block th:each="p, s : ${g.products()}">
                    <a th:replace="~{fragments :: card(${p}, ${#numbers.formatInteger(s.count, 2)})}"></a>
                </th:block>
            </div>
            <p class="tiny" style="margin-top:22px" th:if="${#lists.isEmpty(g.products())}"
               th:text="#{series.empty}">该品类本季暂无在售款。</p>
        </section>
    </th:block>

    <div style="height:86px"></div>
    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
</body>
</html>
