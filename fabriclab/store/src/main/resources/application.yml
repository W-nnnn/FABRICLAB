server:
  port: 8080
  servlet:
    session:
      # 用户端独立 Cookie 名，与管理端（8081）会话隔离（AC-06）。
      cookie:
        name: STORESESSION
        http-only: true
      timeout: 30m

spring:
  application:
    name: fabriclab-store
  thymeleaf:
    cache: false
    encoding: UTF-8
  web:
    resources:
      cache:
        cachecontrol:
          # 静态资源（css/字体/图片）每次协商重验，避免样式更新后浏览器仍用旧缓存
          no-cache: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:MyPetStore}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
