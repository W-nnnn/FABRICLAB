svc.faq.q1=尺码与版型怎么选？
svc.faq.a1=每款详情写有版型、面料与克重，本站一款一个 SKU，不做多规格选择。拿不准时留下身高、肩宽与款号，客服按具体款式回复建议。
svc.faq.q2=天然纤维的衣服怎么洗护？
svc.faq.a2=山羊绒与羊毛建议通风悬挂、少水洗，浮绒用软毛刷顺向轻刷；「面料档案」按纤维分四类给出洗护说明。局部污渍可送门店处理。
svc.faq.q3=教学模拟支付后在哪里看状态？
svc.faq.a3=在「我的订单」按状态筛选。模拟支付成功后订单变为待发货，并写入 MOCK 凭证与支付时间；本演示不涉及真实资金与退款。
svc.faq.q4=下单后能改哪些信息？
svc.faq.a4=仅待支付、待发货订单可改收货人、电话与地址三项；金额与商品明细是下单时的快照，不随商品调价变化，也不提供物流轨迹。
svc.faq.q5=到店试穿需要预约吗？
svc.faq.a5=静安门店 11:00—20:00 无需预约；一次想试三款以上，建议来电预留试衣间。也可以留下款号，让客服确认店内在架情况。
