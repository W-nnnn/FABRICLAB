fabrics.hero.kicker=四种纤维 · 四段来路
fabrics.hero.lead=我们做衣服不从颜色开始，从一根纤维开始。不进染缸，不上整理剂，本色就是成衣的颜色。这份档案写的不是参数表，是每一类材料从哪里来、怎样被织成布、又会怎样跟着穿的人慢慢变老。
