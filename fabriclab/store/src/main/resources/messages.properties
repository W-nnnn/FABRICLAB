fabrics.closing.eyebrow=MATERIAL FIRST
fabrics.closing.line=一件衣服的寿命，从纤维开始算。
fabrics.closing.sub=不过染缸，不上整理剂。颜色是材料给的，时间留下的痕迹也还给它。

fabrics.f1.latin=SILK · Bombyx mori
fabrics.f1.quote=光泽不是加上去的，是纤维自己带的。
fabrics.f1.story1=桑蚕丝从缫丝车上下来，就是它最终的颜色。我们不把它送进染缸，也不做增白：同一批纱线之间那一点深浅，是蚕吃了不同桑叶留下的。做成贴身层以后，这些差别会在光里慢慢显出来。
fabrics.f1.story2=丝的软是穿出来的，不是洗出来的。前几次上身它还带一点骨，半年后肩线和领口会顺着人的动作走；十年后颜色更暖，却不会发灰发白——因为它本来就没有可以被洗掉的颜料。
fabrics.f1.f1=江浙两地的定点蚕场，一季只收春蚕与早秋蚕两批；每批留样，编号一直跟到成衣。
fabrics.f1.f2=缎纹与双绉两种织法，克重压在贴身层承受得住的范围；不上柔顺剂，布面留一点细微的摩擦感。
fabrics.f1.f3=象牙白、月白、浅杏，都是蚕丝本色；同款不同批会有看得见的色差，我们不把它们挑齐。
fabrics.f1.t1=内敛的珍珠光，随角度变化，不随灯光发亮。
fabrics.f1.t2=轻而贴，走动时顺着身体走，不撑出形状。
fabrics.f1.t3=纤维之间留有空隙，贴身也不闷。
fabrics.f1.t4=怕钩怕暴晒，但妥善收纳能穿很多年，越穿越软。

fabrics.f2.latin=CASHMERE & WOOL · 未染原毛
fabrics.f2.quote=暖不靠厚度，靠纤维里存住的空气。
fabrics.f2.story1=澳洲两家牧场按天然色分级交原毛，诺曼底一家织厂负责亚麻那部分。原毛只做洗毛与梳理，不漂白也不染色：一只羊背上的浅灰、腹部的米白，纺成纱之后仍然留在同一件衣服上。
fabrics.f2.story2=我们让羊毛保留一点绒感。烧毛、上浆能让布面看起来更贵，但那层东西洗几次就没了，剩下的反而是变薄的布。不上整理剂的羊毛第一年略显毛躁，第三年才进入它最好的状态。
fabrics.f2.f1=澳洲两家牧场与诺曼底一家织厂；原毛按天然色分级，不混批。
fabrics.f2.f2=粗纺与精纺各走一条线；织造不烧毛，纺纱不上柔顺剂。
fabrics.f2.f3=米白、浅灰、驼、深棕，全是羊本身的色；同色不同牧场会有细微差。
fabrics.f2.t1=几乎不反光，哑光里带一层很浅的绒。
fabrics.f2.t2=有分量却不往下坠，肩线能自己立住。
fabrics.f2.t3=卷曲的纤维存住空气，冷天保暖，室内不憋。
fabrics.f2.t4=耐磨；初期浮绒起球，修掉之后趋于稳定。

fabrics.f3.latin=COTTON & LINEN · 本白与雨露麻
fabrics.f3.quote=洗过三水之后，才是它该有的样子。
fabrics.f3.story1=本白棉织前不漂白，雨露麻靠露水与日晒自然脱胶，所以布面上会有细小的麻结与深浅条。这些不是瑕疵，是纤维没有被化学处理过的证据。
fabrics.f3.story2=新衣服的挺括来自织法，不是上浆。第一水会缩一点、软一点，第三水之后布松到刚好贴合身体，往后很多年都停在这个状态。我们把版型按洗后尺寸打，不按出厂尺寸打。
fabrics.f3.f1=本白棉来自固定轧花厂；雨露麻由诺曼底织厂按年份留档。
fabrics.f3.f2=平纹与斜纹为主，织前不漂白、不上浆；预缩后按洗后尺寸校正版型。
fabrics.f3.f3=本白、燕麦、亚麻灰；色差来自年份与地块。
fabrics.f3.t1=完全哑光，日光下能看见织纹的走向。
fabrics.f3.t2=有骨，撑得住宽松剪裁，坐下会有自然折痕。
fabrics.f3.t3=麻的空隙大，是夏天最凉的一类。
fabrics.f3.t4=越洗越软而强度不降；折痕会记住常穿的姿势。

fabrics.f4.latin=OTHER FIBRES · 结构与辅料
fabrics.f4.quote=主料永远是天然纤维，其余只负责把形状撑住。
fabrics.f4.story1=混纺与再生纤维只出现在需要硬度的部位：帽衬、袋盖、腰带、领座。它们不贴身，也不负责透气，作用只有一个——让一件软衣服有清楚的轮廓。
fabrics.f4.story2=我们尽量让这些部位可拆、可换。修补时先换辅料，不动主料；一件衣服被修过几次之后，主料还完整，形状也还在。
fabrics.f4.f1=按部位选定供应商，颜色跟着当年主料的本色走。
fabrics.f4.f2=只在局部使用，织法以稳定、可替换为主。
fabrics.f4.f3=跟随主料配色，不做独立染色批次。
fabrics.f4.t1=随主料，不额外制造亮点。
fabrics.f4.t2=提供支撑，让轮廓清楚。
fabrics.f4.t3=不贴身，对体感影响很小。
fabrics.f4.t4=可以单独更换，不必换掉整件。
