fabrics.f1.img1=桑蚕丝 · 本色缎面，未染
fabrics.f1.img2=同批生丝 · 折叠后的光
fabrics.f2.img1=未染羊毛 · 针织组织
fabrics.f2.img2=粗纺羊毛 · 经纬与绒毛
