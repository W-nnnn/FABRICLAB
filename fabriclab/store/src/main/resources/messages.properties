fabrics.silk.t=丝
fabrics.silk.d=未经染色的蚕丝与缎，只做贴身层。光泽来自纤维本身，不是整理剂；穿久会更软，不会发亮发白。
fabrics.wool.t=羊绒与羊毛
fabrics.wool.d=澳洲两家牧场的未染羊毛与羊绒，亚麻来自诺曼底一家织厂。不过染缸，不上整理剂，纤维本色直接成衣。
fabrics.cotton.t=棉与麻
fabrics.cotton.d=本白棉与雨露麻，织前不漂白。挺括来自织法而不是上浆，洗过三水之后才是它该有的样子。
fabrics.other.t=其他纤维
fabrics.other.d=混纺与再生纤维，只用在有硬度的部位：帽衬、袋盖、腰带。主料仍然是天然纤维。
crafts.title=工艺说明
crafts.eyebrow=CRAFT NOTES / 工坊
crafts.lead=染、织、裁、缝四步，是每一件成衣经过的完整路径；页尾是当季在售的成品。
crafts.samples=当季在售
crafts.all=看全部商品 →
crafts.more=看工艺说明 →
crafts.n1=不过染缸：纤维的本色就是成衣的颜色。同一批纱线的色差被保留下来，那是材料在说话。
crafts.n2=天然纤维纱线：纺纱不上柔顺剂，织造不烧毛。布面保留一点绒感，是为了穿十年而不是卖相。
crafts.n3=第九版版型：一季只磨一个版。每个版次都留档，肩线、胸围、袖窿的改动画在纸上，不靠猜。
crafts.n4=终身免费修补：同一间工坊接回每一件卖出的衣服。开线、磨破、换扣，都算在版型的寿命里。
