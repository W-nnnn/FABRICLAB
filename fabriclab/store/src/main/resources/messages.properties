crafts.c1.latin=NO DYE VAT · 不染
crafts.c1.quote=不进染缸，是整套工序里最先定下来的一步。
crafts.c1.story1=成衣的颜色来自纤维本身：蚕丝是象牙白，羊毛从米白到深棕，棉与麻是本白与亚麻灰。我们不漂白、不增白，也不做统一色的拼配——同一批纱线里深的浅的纺到一起，织进同一件衣服。
crafts.c1.story2=省下来的不只是染料。染一缸布要反复升温、水洗、固色，一件衣服的水耗大半发生在这里。不染之后，布只走一次预缩：常温水洗、低温烘干，把缩率放掉，剩下的尺寸才是我们打版用的尺寸。
crafts.c1.imgcap=本白棉布 · 未染，只做一次预缩
crafts.c1.check=布面在日光下没有浮色，水洗两次不褪不黄；同款不同批的色差在留样范围内，写进记录。
crafts.c1.f1=同一批纱线的色差被保留，不拼色；水洗两次后色差≤半级。
crafts.c1.f2=预缩一轮约 36 小时：水洗、脱水、低温烘干、回潮。
crafts.c1.f3=织厂完成预缩，我们只验布与留样。
crafts.c2.latin=YARN & LOOM · 织
crafts.c2.quote=纱线决定一半，织法决定另一半。
crafts.c2.story1=纺纱不上柔顺剂，织造不烧毛。上过柔顺剂的纱在机器上更好走，但布面会有一层洗几次就消失的滑；烧毛能让表面看起来更贵，代价是布变薄。我们宁可让它第一年有点毛躁。
crafts.c2.story2=平纹、斜纹、缎纹按用途分：贴身层用缎纹与双绉，外套用斜纹，夏季用平纹。密度按克重定，织完不做树脂整理，只在定型机上过一遍蒸汽，让布回到自然状态。
crafts.c2.imgcap=亚麻平纹 · 经纬、麻结与自然条影
crafts.c2.check=同批布留样比对克重与手感；布面不能有硬挺感，折叠后放开要能自然回弹。
crafts.c2.f1=克重误差≤5%，同批布手感一致；不烧毛、不上柔顺剂。
crafts.c2.f2=一款布从纺纱到成品约 6 至 8 周，其中上机 3 天。
crafts.c2.f3=两家织厂按织法分工，我们不自己开织机。
crafts.c3.latin=PATTERN IX · 第九版版型
crafts.c3.quote=版型是在纸上改出来的，不是在模特身上猜出来的。
crafts.c3.story1=一季只磨一个版，到现在是第九版：肩线前后各移过 6 毫米，袖窿深了 4 毫米，胸围松量从 8 厘米收到 6 厘米。每一版的改动画在纸上、留档、编号，能查到是哪一季、为什么改。
crafts.c3.story2=纸样按洗后尺寸打，不按出厂尺寸打——布缩多少，版就补多少。裁剪时一个尺码一层布，不叠十几层硬切；格纹与条纹在侧缝手工对位，必须接上。
crafts.c3.imgcap=成衣上身 · 肩线与袖窿落在第九版上
crafts.c3.check=同尺码三件成衣的肩宽、胸围、袖长误差在 3 毫米内；格纹在侧缝、袖缝处对齐。
crafts.c3.f1=同一尺码三件误差≤3 毫米；对格对条，错位不出厂。
crafts.c3.f2=一个版磨一季，打样三轮，试穿两轮。
crafts.c3.f3=版师两人，裁床一间，都在同一个工坊里。
crafts.c4.latin=SINGLE NEEDLE · 缝
crafts.c4.quote=一件衣服能穿多久，最后落在针脚上。
crafts.c4.story1=主缝单针，针距 3 毫米；受力处——袖窿、裆、袋口——加一道包缝或打枣。扣位下面垫布，扣眼锁边两遍。这些在成衣表面看不见，但决定了它第三年会不会开线。
crafts.c4.story2=卖出去的每一件都能拿回来修：开线、磨破、换扣、换拉链，同一间工坊接。修的时候先换辅料，不动主料；一件衣服可以被修几次，主料还完整，形状也还在。
crafts.c4.imgcap=罗纹领口 · 单针缝合与包缝收口
crafts.c4.check=翻转内里检查线头与包缝；扣位拉扯 30 次不脱线；修补记录跟着订单号走。
crafts.c4.f1=主缝针距 3 毫米，受力处加固；扣位拉力测试 30 次。
crafts.c4.f2=一件外套约 4.5 小时车缝，修补按工时计。
crafts.c4.f3=同一批缝纫工，修补也由她们接，认得出自己缝的哪一件。
