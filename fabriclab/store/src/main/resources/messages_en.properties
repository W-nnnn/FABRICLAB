svc.faq.q1=How do I choose a size?
svc.faq.a1=Each product page lists cut, fabric and weight; one style has one SKU, with no variant selector. Tell us your height, shoulder width and the style number, and we will advise on that piece.
svc.faq.q2=How do I care for natural fibres?
svc.faq.a2=For cashmere and wool, air the garment rather than washing it often, and brush surface pilling gently with a soft brush. The Fabric Archive groups care notes by fibre. Bring local marks to the store.
svc.faq.q3=Where do I see the mock payment result?
svc.faq.a3=Filter by status in My Orders. A successful mock payment moves the order to Awaiting Shipment and records a MOCK reference and payment time. No real funds or refunds are involved.
svc.faq.q4=What can be changed after checkout?
svc.faq.a4=Receiver name, phone and address can be edited only while the order is pending payment or awaiting shipment. Amounts and line items stay as the checkout snapshot, and no tracking timeline is shown.
svc.faq.q5=Do I need an appointment to try things on?
svc.faq.a5=No appointment is needed at the Jing'an store, 11:00—20:00. For more than three styles, call ahead to reserve a fitting room. You can also leave the style numbers and we will confirm what is in store.
