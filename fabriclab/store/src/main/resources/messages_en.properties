# ── Fabric archive (story edition) ──
fabrics.hero.kicker=Four fibres, four origins
fabrics.hero.lead=We do not begin a garment with a colour. We begin with a single fibre. No dye vat, no finishing agents — the natural colour of the fibre is the colour of the finished piece. This archive is not a spec sheet: it records where each material comes from, how it is woven, and how it grows older alongside the person wearing it.
