fabrics.title=Fabric Archive
fabrics.eyebrow=FABRIC ARCHIVE
fabrics.lead=The archive groups fibres into four families, using the same rule as the care guide on each product page; under each family are the related pieces on sale this season.
fabrics.count={0} on sale
fabrics.empty=No pieces in this family this season.
fabrics.more=Fabric archive →
fabrics.silk.t=Silk
fabrics.silk.d=Undyed mulberry silk and satin, used only for next-to-skin layers. The sheen comes from the fibre itself, not from finishing; it softens with wear and never turns chalky.
fabrics.wool.t=Cashmere & Wool
fabrics.wool.d=Undyed wool and cashmere from two Australian ranches; linen from one mill in Normandy. No dye vat, no finishing agents — the natural colour of the fibre becomes the garment.
fabrics.cotton.t=Cotton & Linen
fabrics.cotton.d=Raw cotton and dew-retted flax, unbleached before weaving. The crispness comes from the weave, not starch; after three washes it becomes what it was meant to be.
fabrics.other.t=Other Fibres
fabrics.other.d=Blends and regenerated fibres, used only where structure is needed: hat brims, pocket flaps, belt lines. The main fabric is always a natural fibre.
crafts.title=Craft Notes
crafts.eyebrow=CRAFT NOTES
crafts.lead=Dye, weave, cut, sew — the four steps every garment passes through; the season's pieces are listed at the end.
crafts.samples=On sale this season
crafts.all=All products →
crafts.more=Craft notes →
crafts.n1=No dye vat: the natural colour of the fibre is the colour of the garment. Shade variation within a batch is kept — that is the material speaking.
crafts.n2=Natural yarn: no softener in spinning, no singeing in weaving. The cloth keeps a slight nap — for ten years of wear, not for the shelf.
crafts.n3=Ninth-pattern fit: one pattern refined per season. Every revision is archived; shoulder, chest and armhole changes are drawn on paper, never guessed.
crafts.n4=Lifetime repair: the same atelier takes back every piece sold. Open seams, worn patches, new buttons — all part of the pattern's lifespan.
series.eyebrow=SERIES
series.lead=Each series page groups pieces by sub-category and lists only what is on sale this season; sold means sold.
series.count=On sale
series.shopAll=Shop the category →
series.empty=Nothing on sale in this sub-category this season.
