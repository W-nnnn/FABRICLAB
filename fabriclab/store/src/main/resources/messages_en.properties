fabrics.closing.eyebrow=MATERIAL FIRST
fabrics.closing.line=A garment's lifespan begins with its fibre.
fabrics.closing.sub=No dye vat, no finishing agents. The colour is given by the material; the marks of time are given back to it.

fabrics.f1.latin=SILK · Bombyx mori
fabrics.f1.quote=Sheen is not applied. It comes with the fibre.
fabrics.f1.story1=Silk leaves the reeling frame in its final colour. We do not send it to the dye vat or bleach it: the slight difference in shade between two batches is a record of the mulberry leaves the worms ate. Made into a next-to-skin layer, those differences surface slowly in the light.
fabrics.f1.story2=Silk softens through wear, not through washing. It holds a little structure for the first few outings; after six months the shoulder and collar begin to follow the wearer's movement. A decade later the colour is warmer, never chalky — there was never any pigment to wash out.
fabrics.f1.f1=Two partner sericulture farms in Jiangsu and Zhejiang, two lots a year (spring and early autumn); every lot is sampled and its number follows the garment.
fabrics.f1.f2=Satin and double crepe, with weights kept within what a next-to-skin layer can carry. No softener; the cloth keeps a faint, pleasant friction.
fabrics.f1.f3=Ivory, moon white, pale apricot — all natural silk shades. Visible variation between batches is left as it is.
fabrics.f1.t1=A restrained pearl sheen that shifts with the angle, not with the lighting.
fabrics.f1.t2=Light and close, moving with the body rather than holding a shape.
fabrics.f1.t3=Air stays between the filaments; close-fitting without feeling sealed.
fabrics.f1.t4=Sensitive to snags and strong sun, but stored well it lasts for years and softens as it goes.

fabrics.f2.latin=CASHMERE & WOOL · undyed fleece
fabrics.f2.quote=Warmth comes from the air held in the fibre, not from thickness.
fabrics.f2.story1=Two Australian stations deliver fleece graded by natural colour; one mill in Normandy handles the linen. Fleece is only scoured and carded — never bleached, never dyed. The pale grey on a sheep's back and the cream at its belly remain in the same garment once spun.
fabrics.f2.story2=We let wool keep a little nap. Singeing and sizing make cloth look more expensive on the shelf, but that layer washes away and leaves a thinner fabric behind. Without finishing agents, wool looks slightly unruly in its first year and reaches its best state in the third.
fabrics.f2.f1=Two Australian stations and one Normandy mill; fleece graded by natural colour, never blended across lots.
fabrics.f2.f2=Woollen and worsted run on separate lines; no singeing in weaving, no softener in spinning.
fabrics.f2.f3=Cream, pale grey, camel, deep brown — the sheep's own colours, with small differences between stations.
fabrics.f2.t1=Almost no reflection: a matte surface with a very shallow nap.
fabrics.f2.t2=Weight without drag; the shoulder line stands on its own.
fabrics.f2.t3=Crimped fibres hold air — warm outdoors, never stifling indoors.
fabrics.f2.t4=Hard-wearing; early pilling is loose surface fibre and settles once removed.

fabrics.f3.latin=COTTON & LINEN · raw white & dew-retted flax
fabrics.f3.quote=After three washes, it becomes what it was meant to be.
fabrics.f3.story1=Raw cotton is woven unbleached; dew-retted flax is broken down by dew and sun, so the cloth carries small slubs and faint shade bands. These are not defects — they are evidence that the fibre was never chemically treated.
fabrics.f3.story2=A new piece gets its crispness from the weave, not from starch. The first wash shrinks and softens it a little; by the third, the cloth relaxes into the body and stays there for years. Our patterns are cut to the washed dimensions, not the loom-state ones.
fabrics.f3.f1=Raw cotton from one fixed gin; dew-retted flax archived by harvest year at the Normandy mill.
fabrics.f3.f2=Plain and twill weaves, unbleached and unsized; patterns corrected to post-wash measurements.
fabrics.f3.f3=Raw white, oatmeal, flax grey — variation comes from the year and the field.
fabrics.f3.t1=Fully matte; the direction of the weave is visible in daylight.
fabrics.f3.t2=Structured enough for loose cuts, with natural creases when seated.
fabrics.f3.t3=Open spaces in the flax make it the coolest family in summer.
fabrics.f3.t4=Softer with every wash, without losing strength; creases remember how it is worn.

fabrics.f4.latin=OTHER FIBRES · structure & trims
fabrics.f4.quote=The main cloth is always natural fibre; everything else just holds the shape.
fabrics.f4.story1=Blends and regenerated fibres appear only where hardness is needed: hat brims, pocket flaps, waistbands, collar stands. They never sit against the skin and are not asked to breathe. Their single job is to give a soft garment a clear outline.
fabrics.f4.story2=We try to make these parts removable and replaceable. A repair starts with the trim, not the main cloth; after several repairs the body of the garment is still intact, and so is its shape.
fabrics.f4.f1=Suppliers chosen per component; colours follow the season's natural main cloth.
fabrics.f4.f2=Used locally only, woven for stability and easy replacement.
fabrics.f4.f3=Matched to the main cloth, with no separate dye lots.
fabrics.f4.t1=Follows the main cloth; adds no highlight of its own.
fabrics.f4.t2=Provides support so the silhouette reads clearly.
fabrics.f4.t3=Never next to the skin; little effect on how the piece feels.
fabrics.f4.t4=Can be replaced on its own, without replacing the whole garment.
