crafts.c1.latin=NO DYE VAT · undyed
crafts.c1.quote=Skipping the dye vat is the first decision in the whole process.
crafts.c1.story1=The colour of a garment comes from the fibre itself: ivory for silk, off-white to deep brown for wool, raw white and linen grey for cotton and flax. We do not bleach, we do not brighten, and we do not blend lots to force a uniform shade — light and dark yarns from one batch are spun together into the same garment.
crafts.c1.story2=What we save is not only dyestuff. Dyeing a batch means repeated heating, rinsing and fixing; most of a garment's water use happens there. Without dyeing, the cloth goes through one pre-shrink only: cold wash, low-temperature dry, let the shrinkage out. The size that remains is the size we cut to.
crafts.c1.imgcap=Raw white cotton · undyed, pre-shrunk once
crafts.c1.check=No colour rubs off in daylight; two washes and it neither fades nor yellows. Shade variation between batches stays within the retained sample, and is logged.
crafts.c1.f1=Shade variation within a batch is kept, never blended out; after two washes the difference is half a grade or less.
crafts.c1.f2=One pre-shrink cycle takes about 36 hours: wash, extract, low-temperature dry, condition.
crafts.c1.f3=The mill runs the pre-shrink; we only inspect and keep samples.
crafts.c2.latin=YARN & LOOM · weave
crafts.c2.quote=The yarn decides half. The weave decides the other half.
crafts.c2.story1=No softener in spinning, no singeing in weaving. Softened yarn runs better on the machine, but it leaves a slickness that washes out in a few cycles; singeing makes the surface look more expensive at the cost of thinner cloth. We would rather it feel a little rough in the first year.
crafts.c2.story2=Plain weave, twill and satin are assigned by use: satin and double crepe next to the skin, twill for outer layers, plain weave for summer. Density follows weight. No resin finishing — the cloth passes through steam on the setting frame and returns to its natural state.
crafts.c2.imgcap=Linen plain weave · warp, weft, slubs and natural bands
crafts.c2.check=Retained samples are compared for weight and hand; the cloth must not feel stiff and should spring back after folding.
crafts.c2.f1=Weight tolerance within 5%, consistent hand across the batch; no singeing, no softener.
crafts.c2.f2=Six to eight weeks from spinning to finished cloth, three days of it on the loom.
crafts.c2.f3=Two mills, split by weave. We do not run our own looms.
crafts.c3.latin=PATTERN IX · ninth revision
crafts.c3.quote=Patterns are corrected on paper, not guessed on a body.
crafts.c3.story1=One pattern refined per season. We are on the ninth: the shoulder moved 6 mm forward and back, the armhole 4 mm deeper, chest ease reduced from 8 cm to 6. Every revision is drawn, archived and numbered — which season, and why.
crafts.c3.story2=The paper pattern is cut to washed dimensions, not loom-state ones: whatever the cloth shrinks, the pattern gives back. One layer of cloth per size on the cutting table, never a stack of fifteen; checks and stripes are matched by hand at the side seam.
crafts.c3.imgcap=On the body · shoulder and armhole set to the ninth pattern
crafts.c3.check=Three garments in the same size within 3 mm on shoulder, chest and sleeve; checks aligned at side and sleeve seams.
crafts.c3.f1=Same size, three pieces, within 3 mm; pattern matching is pass/fail before anything leaves.
crafts.c3.f2=One pattern per season, three sample rounds, two fittings.
crafts.c3.f3=Two pattern cutters, one cutting room, same atelier.
crafts.c4.latin=SINGLE NEEDLE · seam
crafts.c4.quote=How long a garment lasts comes down to the stitch.
crafts.c4.story1=Main seams are single-needle at 3 mm. Stress points — armhole, crotch, pocket mouth — get an overlock or a bar tack. Buttons sit on a reinforcing strip; buttonholes are bound twice. None of this shows on the outside, and all of it decides whether the seam opens in year three.
crafts.c4.story2=Anything sold can come back: open seams, worn patches, new buttons, a new zip. The same atelier takes it. Repairs replace trims first and leave the main cloth alone, so a garment can be repaired several times with the body still intact and the shape still there.
crafts.c4.imgcap=Ribbed collar · single-needle seams and overlocked edges
crafts.c4.check=Turn the piece inside out and check thread ends and overlocking; 30 pulls on each button without fraying; repair records follow the order number.
crafts.c4.f1=3 mm stitch on main seams, reinforced stress points; 30-pull button test.
crafts.c4.f2=About 4.5 hours of machining for a coat; repairs are charged by the hour.
crafts.c4.f3=The same machinists, who also take the repairs and recognise the pieces they sewed.
